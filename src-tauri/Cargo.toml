[package]
name = "git-history-viewer"
version = "0.1.0"
description = "A read-only Git history viewer and side-by-side comparison tool."
authors = ["USM"]
license = "MIT"
edition = "2021"

[lib]
name = "git_history_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
aes-gcm = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
percent-encoding = "2.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh2 = "0.9"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
wait-timeout = "0.2"
url = "2"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
