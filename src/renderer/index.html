<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git History Viewer</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #eef1f4; color: #1d2430; font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif; }
      .boot-screen { display: grid; min-height: 100vh; place-items: center; }
      .boot-status { display: inline-flex; align-items: center; gap: 10px; color: #617082; font-size: 13px; }
      .boot-spinner { width: 18px; height: 18px; border: 2px solid #c7d3e2; border-top-color: #1d5fd0; border-radius: 50%; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-spinner { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-live="polite" aria-label="正在启动 Git History Viewer">
        <div class="boot-status"><span class="boot-spinner" aria-hidden="true"></span><span>正在启动...</span></div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
